name: CI

on:
  pull_request:
    branches: [main] # ← el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main] # ← sólo para que main tenga su corrida (la que lee el badge, §3.5)

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend # ajustá a donde esté TU Dockerfile
          push: false # todavía no publicamos la imagen en ningún lado
          tags: backend:ci # el nombre de la imagen (hoy sólo vive dentro del runner)
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          mkdir -p backend-coverage
          docker run --rm -v "${{ github.workspace }}/backend-coverage:/out" backend-test:ci

      - name: Preparar Go para verificar el umbral
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Verificar umbral de cobertura del backend
        run: |
          cd backend
          grep -v -e "repositorio.go" -e "main.go" -e "db.go" \
            ../backend-coverage/coverage.out > ../backend-coverage/coverage_filtrado.out
          TOTAL=$(go tool cover -func=../backend-coverage/coverage_filtrado.out | tail -1 | awk '{print $3}' | tr -d '%')
          UMBRAL=50
          echo "Cobertura del backend (filtrada): ${TOTAL}% (umbral: ${UMBRAL}%)"
          {
            echo "### Coverage del backend"
            echo "| métrica | valor |"
            echo "|---|---|"
            echo "| statements (sin infraestructura) | ${TOTAL}% |"
            echo "| umbral | ${UMBRAL}% |"
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$TOTAL" -v u="$UMBRAL" 'BEGIN { exit !(t < u) }'; then
            echo "ERROR: cobertura ${TOTAL}% por debajo del umbral ${UMBRAL}%"
            exit 1
          fi

      - name: Publicar el reporte de coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          mkdir -p frontend-coverage
          docker run --rm -e COVERAGE_DIR=/salida/reporte -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midió 0 archivos: revisá el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el reporte de coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage
