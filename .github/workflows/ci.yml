      - name: Generar reporte de tests (placeholder, se completa en TP4)
        run: |
          echo "Reporte de tests: pendiente de implementar en TP4" > test-report.txt
      - name: Publicar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.txt