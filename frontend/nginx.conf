server {
    listen 80;

    # SPA: estáticos, con fallback a index.html para las rutas del router
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que llegue a /api se reenvía al backend por la red interna de compose.
    # El nombre va en una variable (no en el proxy_pass directo) para que nginx
    # lo resuelva recién cuando llega un pedido, y no al arrancar: así este
    # contenedor puede levantar sin que el backend exista todavía.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:8080;

    location /api/ {
        proxy_pass $backend_api;
    }
}
